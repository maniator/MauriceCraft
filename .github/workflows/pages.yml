name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Build jobs are disposable, but GitHub Pages publications must not be
# cancelled mid-flight: doing so can leave a server-side deployment lock.
jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build production website
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Publish Pages
    needs: build
    runs-on: ubuntu-24.04
    # Serialize publication: only the latest pending deployment is kept,
    # while an active publish is allowed to complete safely.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One-time recovery: an earlier Pages deployment timed out and left a
      # server-side lock, even though its Actions workflow had completed.
      - name: Clear orphaned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STALE_PAGES_DEPLOYMENT: 58fa01329b0da83fe8282e6128068e07fc782a79
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GH_REPO}/pages/deployments/${STALE_PAGES_DEPLOYMENT}"
          response="$RUNNER_TEMP/stale-pages-status.json"
          code=$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$url")
          if [[ "$code" == '404' ]]; then
            echo 'Prior Pages deployment record is already gone.'
          elif [[ "$code" != '200' ]]; then
            echo "::error::Could not inspect prior Pages deployment (HTTP $code)."
            cat "$response"
            exit 1
          else
            status=$(jq -r '.status // "unknown"' "$response")
            echo "Prior Pages deployment status: $status"
            if [[ "$status" != 'succeed' && "$status" != 'cancelled' && "$status" != 'canceled' && "$status" != 'failed' && "$status" != 'error' ]]; then
              cancel_response="$RUNNER_TEMP/stale-pages-cancel.json"
              cancel_code=$(curl --silent --show-error --location --request POST \
                --output "$cancel_response" --write-out '%{http_code}' \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "$url/cancel")
              if [[ "$cancel_code" != '204' && "$cancel_code" != '404' ]]; then
                echo "::error::Failed to cancel stale Pages deployment (HTTP $cancel_code)."
                cat "$cancel_response"
                exit 1
              fi
              echo 'Requested cancellation of stale Pages deployment.'
            fi
          fi
      - name: Deploy production website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
