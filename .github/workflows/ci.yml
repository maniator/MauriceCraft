name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit coverage and browser regression
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit coverage, TypeScript, and production build
        run: npm run check:tests
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile production website
        run: npm run test:e2e
      - name: Verify seeded desktop/mobile captures and approved baselines
        run: npm run test:visual
      - name: Publish seeded visual candidates for manual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seeded-visual-captures
          path: |
            test-results/**/visual-captures/*.png
            test-results/**/*-diff.png
            test-results/**/*-actual.png
            test-results/**/*-expected.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-regressions
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
